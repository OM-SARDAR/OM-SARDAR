<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     width="100%"
     height="100%">

  <defs>

    <!-- ================================================================ -->
    <!-- BACKGROUND -->
    <!-- ================================================================ -->

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050914"/>
      <stop offset="50%"  stop-color="#08111f"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%"   stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="45%"  stop-color="#2563eb" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- ================================================================ -->
    <!-- CARD -->
    <!-- ================================================================ -->

    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#091321"/>
    </linearGradient>

    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0b2135"/>
      <stop offset="100%" stop-color="#081827"/>
    </linearGradient>

    <!-- ================================================================ -->
    <!-- GLOWS -->
    <!-- ================================================================ -->

    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="6"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <filter id="smallGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="2.5"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- ================================================================ -->
    <!-- GRID -->
    <!-- ================================================================ -->

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#38bdf8"
            stroke-opacity="0.035"
            stroke-width="1"/>

    </pattern>

    <!-- ================================================================ -->
    <!-- ARROW -->
    <!-- ================================================================ -->

    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto">

      <path d="M0,0 L10,5 L0,10 Z"
            fill="#38bdf8"/>

    </marker>

    <!-- ================================================================ -->
    <!-- CLIP -->
    <!-- ================================================================ -->

    <clipPath id="frameClip">
      <rect x="25"
            y="25"
            width="1550"
            height="850"
            rx="28"/>
    </clipPath>

  </defs>


  <!-- ================================================================ -->
  <!-- STYLE -->
  <!-- ================================================================ -->

  <style>

    .title {
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #f8fafc;
    }

    .subtitle {
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #64748b;
    }

    .section {
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #38bdf8;
    }

    .node-title {
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #f8fafc;
      text-anchor: middle;
    }

    .node-sub {
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: 11px;
      fill: #64748b;
      text-anchor: middle;
    }

    .small {
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: 10px;
      fill: #475569;
      letter-spacing: 1px;
    }

    .flow {
      stroke: #38bdf8;
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 7 8;
      animation: flow 2.5s linear infinite;
    }

    .flow-soft {
      stroke: #0ea5e9;
      stroke-width: 1;
      fill: none;
      stroke-dasharray: 4 9;
      opacity: 0.35;
      animation: flow 4s linear infinite;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .scan {
      animation: scan 5s ease-in-out infinite;
    }

    .float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes flow {
      from {
        stroke-dashoffset: 30;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes pulse {
      0%,100% {
        opacity: 0.45;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @keyframes scan {
      0% {
        transform: translateX(-900px);
        opacity: 0;
      }
      20% {
        opacity: 0.35;
      }
      70% {
        opacity: 0.15;
      }
      100% {
        transform: translateX(900px);
        opacity: 0;
      }
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

  </style>


  <!-- ================================================================ -->
  <!-- BACKGROUND -->
  <!-- ================================================================ -->

  <rect width="1600"
        height="900"
        fill="url(#bg)"/>

  <rect width="1600"
        height="900"
        fill="url(#ambientGlow)"/>

  <rect x="25"
        y="25"
        width="1550"
        height="850"
        rx="28"
        fill="url(#grid)"/>


  <!-- ================================================================ -->
  <!-- OUTER FRAME -->
  <!-- ================================================================ -->

  <rect x="25"
        y="25"
        width="1550"
        height="850"
        rx="28"
        fill="none"
        stroke="#1e3a5f"
        stroke-width="1.5"/>

  <rect x="32"
        y="32"
        width="1536"
        height="836"
        rx="22"
        fill="none"
        stroke="#38bdf8"
        stroke-opacity="0.08"/>


  <!-- ================================================================ -->
  <!-- CORNER ACCENTS -->
  <!-- ================================================================ -->

  <path d="M55 105 V55 H105"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"
        opacity="0.8"/>

  <path d="M1495 55 H1545 V105"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"
        opacity="0.8"/>

  <path d="M55 795 V845 H105"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"
        opacity="0.5"/>

  <path d="M1495 845 H1545 V795"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"
        opacity="0.5"/>


  <!-- ================================================================ -->
  <!-- HEADER -->
  <!-- ================================================================ -->

  <text x="80"
        y="92"
        class="section">
    PRODUCTION SYSTEM ARCHITECTURE
  </text>

  <text x="80"
        y="130"
        class="title">
    SYSTEM ARCHITECTURE
  </text>

  <text x="80"
        y="158"
        class="subtitle">
    CLIENT → EDGE → APPLICATION → DATA → OBSERVABILITY
  </text>


  <!-- STATUS -->
  <g transform="translate(1370 85)">

    <circle cx="0"
            cy="0"
            r="5"
            fill="#22c55e"
            class="pulse"
            filter="url(#smallGlow)"/>

    <text x="16"
          y="4"
          class="small">
      SYSTEM ONLINE
    </text>

  </g>


  <!-- ================================================================ -->
  <!-- CLIENT LAYER -->
  <!-- ================================================================ -->

  <text x="800"
        y="205"
        class="section"
        text-anchor="middle">
    01 · CLIENT
  </text>


  <g class="float">

    <rect x="600"
          y="225"
          width="400"
          height="82"
          rx="16"
          fill="url(#card)"
          stroke="#1e4f73"
          stroke-width="1.5"/>

    <rect x="600"
          y="225"
          width="400"
          height="82"
          rx="16"
          fill="none"
          stroke="#38bdf8"
          stroke-opacity="0.10"/>

    <circle cx="640"
            cy="266"
            r="12"
            fill="#0ea5e9"
            fill-opacity="0.12"
            stroke="#38bdf8"
            stroke-opacity="0.6"/>

    <circle cx="640"
            cy="266"
            r="4"
            fill="#38bdf8"
            class="pulse"/>

    <text x="800"
          y="260"
          class="node-title">
      CLIENT
    </text>

    <text x="800"
          y="282"
          class="node-sub">
      React / Web Application
    </text>

  </g>


  <!-- ================================================================ -->
  <!-- CLIENT → LOAD BALANCER -->
  <!-- ================================================================ -->

  <path d="M800 307 L800 350"
        class="flow"
        marker-end="url(#arrow)"/>

  <circle cx="800"
          cy="326"
          r="4"
          fill="#38bdf8"
          class="pulse"
          filter="url(#smallGlow)"/>


  <!-- ================================================================ -->
  <!-- EDGE LAYER -->
  <!-- ================================================================ -->

  <text x="800"
        y="382"
        class="section"
        text-anchor="middle">
    02 · EDGE / TRAFFIC MANAGEMENT
  </text>


  <g>

    <rect x="600"
          y="400"
          width="400"
          height="82"
          rx="16"
          fill="url(#card)"
          stroke="#1e4f73"
          stroke-width="1.5"/>

    <circle cx="640"
            cy="441"
            r="12"
            fill="#2563eb"
            fill-opacity="0.12"
            stroke="#38bdf8"
            stroke-opacity="0.6"/>

    <path d="M634 441 H646"
          stroke="#38bdf8"
          stroke-width="2"/>

    <text x="800"
          y="435"
          class="node-title">
      LOAD BALANCER
    </text>

    <text x="800"
          y="457"
          class="node-sub">
      Nginx / AWS ALB · Routing · TLS · Traffic Distribution
    </text>

  </g>


  <!-- ================================================================ -->
  <!-- LOAD BALANCER → APPLICATION -->
  <!-- ================================================================ -->

  <path d="M800 482 L800 525"
        class="flow"
        marker-end="url(#arrow)"/>

  <circle cx="800"
          cy="502"
          r="4"
          fill="#38bdf8"
          class="pulse"
          filter="url(#smallGlow)"/>


  <!-- ================================================================ -->
  <!-- APPLICATION CORE -->
  <!-- ================================================================ -->

  <rect x="100"
        y="535"
        width="1400"
        height="235"
        rx="22"
        fill="url(#core)"
        stroke="#2563eb"
        stroke-opacity="0.55"
        stroke-width="1.5"/>

  <rect x="108"
        y="543"
        width="1384"
        height="219"
        rx="17"
        fill="none"
        stroke="#38bdf8"
        stroke-opacity="0.07"/>


  <!-- Core heading -->

  <text x="135"
        y="570"
        class="section">
    03 · APPLICATION CORE
  </text>

  <text x="135"
        y="600"
        class="node-title"
        text-anchor="start">
    API / APPLICATION
  </text>

  <text x="135"
        y="621"
        class="node-sub"
        text-anchor="start">
    Node.js / Spring Boot · Business Logic · Services
  </text>


  <!-- ================================================================ -->
  <!-- APPLICATION NODES -->
  <!-- ================================================================ -->

  <!-- AUTH -->

  <g>

    <rect x="135"
          y="650"
          width="190"
          height="88"
          rx="14"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="164"
            cy="681"
            r="7"
            fill="#38bdf8"
            class="pulse"/>

    <text x="230"
          y="685"
          class="node-title">
      AUTH
    </text>

    <text x="230"
          y="708"
          class="node-sub">
      JWT · OAuth2
    </text>

  </g>


  <!-- CACHE -->

  <g>

    <rect x="350"
          y="650"
          width="190"
          height="88"
          rx="14"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="379"
            cy="681"
            r="7"
            fill="#38bdf8"
            class="pulse"
            style="animation-delay:.3s"/>

    <text x="445"
          y="685"
          class="node-title">
      CACHE
    </text>

    <text x="445"
          y="708"
          class="node-sub">
      Redis · Fast Access
    </text>

  </g>


  <!-- QUEUE -->

  <g>

    <rect x="565"
          y="650"
          width="190"
          height="88"
          rx="14"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="594"
            cy="681"
            r="7"
            fill="#38bdf8"
            class="pulse"
            style="animation-delay:.6s"/>

    <text x="660"
          y="685"
          class="node-title">
      QUEUE
    </text>

    <text x="660"
          y="708"
          class="node-sub">
      Kafka · Async Events
    </text>

  </g>


  <!-- DATABASE -->

  <g>

    <rect x="780"
          y="650"
          width="190"
          height="88"
          rx="14"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="809"
            cy="681"
            r="7"
            fill="#38bdf8"
            class="pulse"
            style="animation-delay:.9s"/>

    <text x="875"
          y="685"
          class="node-title">
      DATABASE
    </text>

    <text x="875"
          y="708"
          class="node-sub">
      MongoDB · SQL
    </text>

  </g>


  <!-- STORAGE -->

  <g>

    <rect x="995"
          y="650"
          width="190"
          height="88"
          rx="14"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="1024"
            cy="681"
            r="7"
            fill="#38bdf8"
            class="pulse"
            style="animation-delay:1.2s"/>

    <text x="1090"
          y="685"
          class="node-title">
      STORAGE
    </text>

    <text x="1090"
          y="708"
          class="node-sub">
      Cloudinary · Objects
    </text>

  </g>


  <!-- EXTERNAL -->

  <g>

    <rect x="1210"
          y="650"
          width="250"
          height="88"
          rx="14"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="1239"
            cy="681"
            r="7"
            fill="#38bdf8"
            class="pulse"
            style="animation-delay:1.5s"/>

    <text x="1335"
          y="685"
          class="node-title">
      EXTERNAL APIs
    </text>

    <text x="1335"
          y="708"
          class="node-sub">
      Third-Party Services
    </text>

  </g>


  <!-- ================================================================ -->
  <!-- INTERNAL DATA FLOW -->
  <!-- ================================================================ -->

  <path d="M230 638 C230 625 230 620 230 610"
        class="flow-soft"/>

  <path d="M445 638 C445 625 445 620 445 610"
        class="flow-soft"/>

  <path d="M660 638 C660 625 660 620 660 610"
        class="flow-soft"/>

  <path d="M875 638 C875 625 875 620 875 610"
        class="flow-soft"/>

  <path d="M1090 638 C1090 625 1090 620 1090 610"
        class="flow-soft"/>

  <path d="M1335 638 C1335 625 1335 620 1335 610"
        class="flow-soft"/>


  <!-- ================================================================ -->
  <!-- OBSERVABILITY -->
  <!-- ================================================================ -->

  <g>

    <rect x="600"
          y="805"
          width="400"
          height="42"
          rx="12"
          fill="#081321"
          stroke="#1e3a5f"/>

    <circle cx="630"
            cy="826"
            r="4"
            fill="#22c55e"
            class="pulse"/>

    <text x="650"
          y="830"
          class="small">
      OBSERVABILITY
    </text>

    <text x="790"
          y="830"
          class="small">
      LOGS · METRICS · TRACES
    </text>

  </g>


  <!-- ================================================================ -->
  <!-- OBSERVABILITY CONNECTOR -->
  <!-- ================================================================ -->

  <path d="M800 770 L800 805"
        class="flow"
        marker-end="url(#arrow)"/>


  <!-- ================================================================ -->
  <!-- SCANNING LIGHT -->
  <!-- ================================================================ -->

  <g clip-path="url(#frameClip)">

    <rect x="300"
          y="25"
          width="180"
          height="850"
          fill="#38bdf8"
          opacity="0.025"
          class="scan"/>

  </g>


  <!-- ================================================================ -->
  <!-- FOOTER -->
  <!-- ================================================================ -->

  <text x="80"
        y="850"
        class="small">
    DISTRIBUTED SYSTEM · SCALABILITY · SECURITY · OBSERVABILITY
  </text>

</svg>