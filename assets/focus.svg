<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 520"
     width="100%"
     height="100%">

  <defs>

    <!-- ============================================================ -->
    <!-- BACKGROUND -->
    <!-- ============================================================ -->

    <linearGradient id="bg"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%"   stop-color="#050914"/>
      <stop offset="50%"  stop-color="#08111f"/>
      <stop offset="100%" stop-color="#050914"/>

    </linearGradient>

    <radialGradient id="glow"
                    cx="24%"
                    cy="50%"
                    r="50%">

      <stop offset="0%"
            stop-color="#0ea5e9"
            stop-opacity="0.14"/>

      <stop offset="45%"
            stop-color="#2563eb"
            stop-opacity="0.045"/>

      <stop offset="100%"
            stop-color="#000000"
            stop-opacity="0"/>

    </radialGradient>


    <!-- ============================================================ -->
    <!-- CARD -->
    <!-- ============================================================ -->

    <linearGradient id="card"
                    x1="0%"
                    y1="0%"
                    x2="0%"
                    y2="100%">

      <stop offset="0%"   stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#091321"/>

    </linearGradient>


    <!-- ============================================================ -->
    <!-- RADAR GRADIENT -->
    <!-- ============================================================ -->

    <radialGradient id="radarGlow">

      <stop offset="0%"
            stop-color="#38bdf8"
            stop-opacity="0.18"/>

      <stop offset="55%"
            stop-color="#38bdf8"
            stop-opacity="0.04"/>

      <stop offset="100%"
            stop-color="#38bdf8"
            stop-opacity="0"/>

    </radialGradient>


    <!-- ============================================================ -->
    <!-- GLOW -->
    <!-- ============================================================ -->

    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="6"
                      result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <filter id="smallGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="2.5"
                      result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- ============================================================ -->
    <!-- GRID -->
    <!-- ============================================================ -->

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0 L0 0 0 40"
            fill="none"
            stroke="#38bdf8"
            stroke-opacity="0.035"
            stroke-width="1"/>

    </pattern>


    <!-- ============================================================ -->
    <!-- RADAR CLIP -->
    <!-- ============================================================ -->

    <clipPath id="radarClip">

      <circle cx="250"
              cy="260"
              r="145"/>

    </clipPath>


    <!-- ============================================================ -->
    <!-- ANIMATIONS -->
    <!-- ============================================================ -->

    <style>

      .heading {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #f8fafc;
      }

      .section {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        fill: #38bdf8;
      }

      .subtitle {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: 13px;
        letter-spacing: 1.5px;
        fill: #64748b;
      }

      .focusTitle {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: 700;
        fill: #f8fafc;
      }

      .focusText {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: 11px;
        fill: #64748b;
      }

      .mono {
        font-family: "Courier New", monospace;
        font-size: 11px;
        letter-spacing: 1px;
      }

      .radarLine {
        stroke: #38bdf8;
        stroke-opacity: 0.16;
        fill: none;
      }

      .scan {
        animation: radarSweep 4s linear infinite;
        transform-origin: 250px 260px;
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .blink {
        animation: blink 2.2s ease-in-out infinite;
      }

      .flow {
        animation: flow 2s linear infinite;
      }

      .bar {
        animation: barPulse 3s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: left center;
      }

      @keyframes radarSweep {

        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }

      }

      @keyframes pulse {

        0%, 100% {
          opacity: 0.45;
          transform: scale(0.85);
        }

        50% {
          opacity: 1;
          transform: scale(1.15);
        }

      }

      @keyframes blink {

        0%, 100% {
          opacity: 0.25;
        }

        50% {
          opacity: 1;
        }

      }

      @keyframes flow {

        from {
          stroke-dashoffset: 30;
        }

        to {
          stroke-dashoffset: 0;
        }

      }

      @keyframes barPulse {

        0%, 100% {
          opacity: 0.45;
        }

        50% {
          opacity: 1;
        }

      }

    </style>

  </defs>


  <!-- ============================================================ -->
  <!-- BACKGROUND -->
  <!-- ============================================================ -->

  <rect width="1600"
        height="520"
        fill="url(#bg)"/>

  <rect width="1600"
        height="520"
        fill="url(#glow)"/>

  <rect width="1600"
        height="520"
        fill="url(#grid)"/>


  <!-- ============================================================ -->
  <!-- OUTER FRAME -->
  <!-- ============================================================ -->

  <rect x="25"
        y="25"
        width="1550"
        height="470"
        rx="28"
        fill="none"
        stroke="#1e3a5f"
        stroke-width="1.5"/>

  <rect x="32"
        y="32"
        width="1536"
        height="456"
        rx="22"
        fill="none"
        stroke="#38bdf8"
        stroke-opacity="0.07"/>


  <!-- Corner accents -->

  <path d="M55 105 V55 H105"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"
        opacity="0.8"/>

  <path d="M1495 55 H1545 V105"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"
        opacity="0.8"/>

  <path d="M55 415 V465 H105"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"
        opacity="0.45"/>

  <path d="M1495 465 H1545 V415"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"
        opacity="0.45"/>


  <!-- ============================================================ -->
  <!-- HEADER -->
  <!-- ============================================================ -->

  <text x="80"
        y="88"
        class="section">

    DEVELOPMENT DIRECTION

  </text>

  <text x="80"
        y="126"
        class="heading">

    CURRENT FOCUS

  </text>

  <text x="80"
        y="151"
        class="subtitle">

    BUILDING DEPTH · ENGINEERING SYSTEMS · EXPANDING THE STACK

  </text>


  <!-- ============================================================ -->
  <!-- RADAR / FOCUS ENGINE -->
  <!-- ============================================================ -->

  <g>

    <!-- Ambient glow -->

    <circle cx="250"
            cy="270"
            r="180"
            fill="url(#radarGlow)"/>


    <!-- Outer rings -->

    <circle cx="250"
            cy="270"
            r="145"
            class="radarLine"
            stroke-width="1"/>

    <circle cx="250"
            cy="270"
            r="110"
            class="radarLine"
            stroke-width="1"/>

    <circle cx="250"
            cy="270"
            r="75"
            class="radarLine"
            stroke-width="1"/>

    <circle cx="250"
            cy="270"
            r="40"
            class="radarLine"
            stroke-width="1"/>


    <!-- Crosshair -->

    <line x1="105"
          y1="270"
          x2="395"
          y2="270"
          stroke="#38bdf8"
          stroke-opacity="0.07"/>

    <line x1="250"
          y1="125"
          x2="250"
          y2="415"
          stroke="#38bdf8"
          stroke-opacity="0.07"/>


    <!-- Radar sweep -->

    <g class="scan">

      <path d="M250 270 L250 125 A145 145 0 0 1 353 168 Z"
            fill="#38bdf8"
            fill-opacity="0.08"/>

      <line x1="250"
            y1="270"
            x2="250"
            y2="125"
            stroke="#38bdf8"
            stroke-width="2"
            opacity="0.75"
            filter="url(#smallGlow)"/>

    </g>


    <!-- Center -->

    <circle cx="250"
            cy="270"
            r="16"
            fill="#081827"
            stroke="#38bdf8"
            stroke-opacity="0.7"/>

    <circle cx="250"
            cy="270"
            r="6"
            fill="#38bdf8"
            class="pulse"
            filter="url(#smallGlow)"/>


    <!-- Focus signals -->

    <circle cx="305"
            cy="205"
            r="5"
            fill="#38bdf8"
            class="pulse"
            filter="url(#smallGlow)"/>

    <circle cx="180"
            cy="325"
            r="4"
            fill="#38bdf8"
            class="blink"/>

    <circle cx="325"
            cy="330"
            r="4"
            fill="#2563eb"
            class="blink"/>

    <circle cx="190"
            cy="195"
            r="3"
            fill="#38bdf8"
            class="blink"/>


    <!-- Radar labels -->

    <text x="250"
          y="115"
          class="mono"
          fill="#334155"
          text-anchor="middle">

      EXPLORE

    </text>

    <text x="410"
          y="274"
          class="mono"
          fill="#334155">

      BUILD

    </text>

    <text x="250"
          y="438"
          class="mono"
          fill="#334155"
          text-anchor="middle">

      ITERATE

    </text>

  </g>


  <!-- ============================================================ -->
  <!-- VERTICAL DIVIDER -->
  <!-- ============================================================ -->

  <line x1="470"
        y1="190"
        x2="470"
        y2="425"
        stroke="#1e3a5f"
        stroke-width="1"/>


  <!-- ============================================================ -->
  <!-- FOCUS CARDS -->
  <!-- ============================================================ -->

  <!-- DSA -->

  <g>

    <rect x="520"
          y="190"
          width="310"
          height="95"
          rx="16"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="550"
            cy="222"
            r="7"
            fill="#38bdf8"
            class="pulse"/>

    <text x="575"
          y="227"
          class="focusTitle">

      DSA

    </text>

    <text x="550"
          y="255"
          class="focusText">

      Algorithms · Data Structures · Problem Solving

    </text>

    <rect x="550"
          y="268"
          width="220"
          height="2"
          rx="1"
          fill="#173b5b"/>

    <rect x="550"
          y="268"
          width="150"
          height="2"
          rx="1"
          fill="#38bdf8"
          class="bar"/>

  </g>


  <!-- SYSTEM DESIGN -->

  <g>

    <rect x="860"
          y="190"
          width="310"
          height="95"
          rx="16"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="890"
            cy="222"
            r="7"
            fill="#38bdf8"
            class="pulse"
            style="animation-delay:.4s"/>

    <text x="915"
          y="227"
          class="focusTitle">

      SYSTEM DESIGN

    </text>

    <text x="890"
          y="255"
          class="focusText">

      Distributed Systems · Scalability · Architecture

    </text>

    <rect x="890"
          y="268"
          width="220"
          height="2"
          rx="1"
          fill="#173b5b"/>

    <rect x="890"
          y="268"
          width="165"
          height="2"
          rx="1"
          fill="#38bdf8"
          class="bar"
          style="animation-delay:.4s"/>

  </g>


  <!-- JAVA -->

  <g>

    <rect x="1200"
          y="190"
          width="310"
          height="95"
          rx="16"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="1230"
            cy="222"
            r="7"
            fill="#38bdf8"
            class="pulse"
            style="animation-delay:.8s"/>

    <text x="1255"
          y="227"
          class="focusTitle">

      JAVA / SPRING BOOT

    </text>

    <text x="1230"
          y="255"
          class="focusText">

      Backend Engineering · APIs · Microservices

    </text>

    <rect x="1230"
          y="268"
          width="220"
          height="2"
          rx="1"
          fill="#173b5b"/>

    <rect x="1230"
          y="268"
          width="175"
          height="2"
          rx="1"
          fill="#38bdf8"
          class="bar"
          style="animation-delay:.8s"/>

  </g>


  <!-- ============================================================ -->
  <!-- SECOND ROW -->
  <!-- ============================================================ -->

  <!-- CLOUD -->

  <g>

    <rect x="520"
          y="310"
          width="310"
          height="95"
          rx="16"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="550"
            cy="342"
            r="7"
            fill="#2563eb"
            class="pulse"
            style="animation-delay:1.2s"/>

    <text x="575"
          y="347"
          class="focusTitle">

      CLOUD / DEVOPS

    </text>

    <text x="550"
          y="375"
          class="focusText">

      AWS · Docker · CI/CD · Infrastructure

    </text>

    <rect x="550"
          y="388"
          width="220"
          height="2"
          rx="1"
          fill="#173b5b"/>

    <rect x="550"
          y="388"
          width="135"
          height="2"
          rx="1"
          fill="#2563eb"
          class="bar"
          style="animation-delay:1.2s"/>

  </g>


  <!-- AI -->

  <g>

    <rect x="860"
          y="310"
          width="310"
          height="95"
          rx="16"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="890"
            cy="342"
            r="7"
            fill="#38bdf8"
            class="pulse"
            style="animation-delay:1.6s"/>

    <text x="915"
          y="347"
          class="focusTitle">

      AI / ML

    </text>

    <text x="890"
          y="375"
          class="focusText">

      Machine Learning · LLMs · AI Integration

    </text>

    <rect x="890"
          y="388"
          width="220"
          height="2"
          rx="1"
          fill="#173b5b"/>

    <rect x="890"
          y="388"
          width="125"
          height="2"
          rx="1"
          fill="#38bdf8"
          class="bar"
          style="animation-delay:1.6s"/>

  </g>


  <!-- ENGINEERING -->

  <g>

    <rect x="1200"
          y="310"
          width="310"
          height="95"
          rx="16"
          fill="url(#card)"
          stroke="#173b5b"/>

    <circle cx="1230"
            cy="342"
            r="7"
            fill="#38bdf8"
            class="pulse"
            style="animation-delay:2s"/>

    <text x="1255"
          y="347"
          class="focusTitle">

      ENGINEERING

    </text>

    <text x="1230"
          y="375"
          class="focusText">

      Clean Code · Security · Production Systems

    </text>

    <rect x="1230"
          y="388"
          width="220"
          height="2"
          rx="1"
          fill="#173b5b"/>

    <rect x="1230"
          y="388"
          width="190"
          height="2"
          rx="1"
          fill="#38bdf8"
          class="bar"
          style="animation-delay:2s"/>

  </g>


  <!-- ============================================================ -->
  <!-- FLOW CONNECTIONS -->
  <!-- ============================================================ -->

  <path d="M470 270 H500"
        stroke="#38bdf8"
        stroke-width="2"
        stroke-dasharray="6 7"
        class="flow"/>

  <circle cx="500"
          cy="270"
          r="3"
          fill="#38bdf8"
          class="pulse"/>


  <!-- ============================================================ -->
  <!-- FOOTER -->
  <!-- ============================================================ -->

  <text x="80"
        y="465"
        class="mono"
        fill="#334155">

    LEARN → BUILD → MEASURE → IMPROVE

  </text>

  <text x="1520"
        y="465"
        class="mono"
        fill="#334155"
        text-anchor="end">

    FOCUS / 2026

  </text>


</svg>